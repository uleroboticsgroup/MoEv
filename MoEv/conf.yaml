        #   C: [0.01, 0.1, 1, 10, 100, 500, 1000]
        #   random_state: [0,2,64,123]              # distintos seeds reproducibles
        - loss: ['squared_hinge']
          penalty: ['l2']
          dual: [True, False]       # l2 + squared_hinge admite dual/primal
          fit_intercept: [True, False]
          max_iter: [100, 200, 400, 800, 1000, 1200, 3000, 5000]
          C: [0.01, 0.1, 1, 10,80,  100,125, 150, 500]
          random_state: [64,16,12,8,5]              # distintos seeds reproducibles
          class_weight: [null, 'balanced']
          tol: [0.00001, 0.0001, 0.001, 0.01]
        # - loss: ['squared_hinge']
        #   penalty: ['l1']
        #   dual: [False]             # l1 sólo con squared_hinge y dual=False
        #   fit_intercept: [True, False]
        #   max_iter: [400, 800, 1000, 1200]
        #   random_state: [0,2,64,123]              # distintos seeds reproducibles
