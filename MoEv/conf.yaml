  Mini_Batch_KMeans_Classifier:
    enabled: False
    name: MiniBatchKMeans
    import: sklearn.cluster
    type: supervised
    GridSearch:
      enabled: False
      dictionary:
        n_clusters: #integer range
        init: [k-means++, random, ndarray]
        max_iter: #range enteros
        batch_size: #range int
        verbose: [True, False]
        compute_labels: [True, False]
        random_state: [None]
        tol: #range float
        max_no_improvement: #range int
        init_size: #range int
        n_init: # range init
        reassignment_ratio: #range float
  Logistic_Regression_Classifier:
    enabled: False
    name: LogisticRegression
    import: sklearn.linear_model
    type: supervised
    parameters:
      dual: False
      fit_intercept: True
      intercept_scaling: 1.0
      max_iter: 150
      penalty: 'none'
      solver: 'sag'
    GridSearch:
      enabled: True
      dictionary:
        # penalty: ['l1', 'l2', 'elasticnet','none']
        # dual: [True, False]
        # C: [0.5, 1.0, 2.0]
        # fit_intercept: [True, False]
