        tol: #range float
  LinearSVC:
    enabled: False
    name: LinearSVC
    import: sklearn.svm
    type: supervised
    GridSearch:
      enabled: True
      dictionary:
        # - loss: ['hinge']
        #   penalty: ['l2']
        #   dual: [True]              # hinge sólo con l2 y dual (liblinear)
        #   fit_intercept: [True, False]
